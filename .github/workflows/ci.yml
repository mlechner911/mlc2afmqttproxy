name: CI

# Every push and pull request, and weekly: new vulnerabilities appear without any change here.
on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: vet, tests (race), govulncheck, version stamp
        run: task check
