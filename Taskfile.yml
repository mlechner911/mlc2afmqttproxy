version: '3'

vars:
  # VERSION-Datei ist die einzige Quelle der Version (semver: Fix → Patch, Feature → Minor).
  # Bis 07.11.2026 kam sie aus `git describe` mit festem Rückfall im Taskfile.
  VERSION:
    sh: cat VERSION
  LDFLAGS: "-X 'main.Version={{.VERSION}}'"

tasks:
  build-server:
    desc: "Baut das Go-Backend in den bin/ Ordner"
    cmds:
      - mkdir -p bin
      - go build -ldflags="{{.LDFLAGS}}" -o bin/mlc-edge-proxy cmd/proxy/main.go


  build-bridge:
    desc: "Baut das MQTT Bridge CLI-Tool in den bin/ Ordner"
    cmds:
      - mkdir -p bin
      - go build -ldflags="{{.LDFLAGS}}" -o bin/mqttbridge cmd/mqttbridge/main.go

  build:
    desc: "Baut Server und Bridge"
    deps: [build-server, build-bridge]

  swagger:
    desc: "Generiert die Swagger-Dokumentation für die REST-API"
    cmds:
      - swag init -g cmd/proxy/main.go -o docs/swagger

  run:
    desc: "Baut und startet den Proxy-Server lokal"
    deps: [build-server]
    cmds:
      - ./bin/mlc-edge-proxy

  devbridge:
    desc: "Startet die MQTT Bridge für lokale Tests (Master: 1883 -> Slave: 1884)"
    deps: [build-bridge]
    cmds:
      - ./bin/mqttbridge --master tcp://localhost:1883 --slave tcp://localhost:1884 --topic "#"

  clean:
    desc: "Löscht generierte Binaries und lokale Daten"
    cmds:
      - rm -rf bin/
      - rm -rf data/

  setup:
    desc: "Initialisiert die Go-Module"
    cmds:
      - go mod tidy

  install-service:
    desc: "Installiert den Systemd Service für die PAKET-Installation (/usr/bin + /etc/mlc-edge-proxy, User mlc-edge-proxy). Für den Betrieb AUS DEM REPO: install-service:local"
    cmds:
      - sudo cp deployment/proxy.service /etc/systemd/system/mlc-edge-proxy.service
      - sudo systemctl daemon-reload
      - sudo systemctl enable mlc-edge-proxy
      - sudo systemctl restart mlc-edge-proxy
      - 'echo "Service installiert und gestartet! Logs gibt es via journalctl -fu mlc-edge-proxy"'

  install-service:local:
    desc: "Installiert BEIDE Systemd-Services für den Betrieb AUS DIESEM REPO (Proxy + mqttbridge, User mlc). Damit überlebt die komplette z2m-Kette einen Reboot. Benötigt sudo."
    deps: [build]
    cmds:
      # Platzhalter /opt/mlc2afmqttproxy → tatsächlicher Repo-Pfad (wie units:install im Sensor-Repo).
      - for u in mlc-edge-proxy mlc-mqttbridge; do sed "s#/opt/mlc2afmqttproxy#$(pwd)#g" "deploy/systemd/$u.service" | sudo tee "/etc/systemd/system/$u.service" > /dev/null; done
      - sudo systemctl daemon-reload
      - sudo systemctl enable --now mlc-edge-proxy mlc-mqttbridge
      - 'echo "✓ mlc-edge-proxy + mlc-mqttbridge installiert + enabled (starten automatisch nach Reboot). Logs: journalctl -fu mlc-edge-proxy / -fu mlc-mqttbridge"'

  uninstall-service:local:
    desc: "Entfernt die aus-dem-Repo Systemd-Services wieder (benötigt sudo)"
    cmds:
      - sudo systemctl disable --now mlc-edge-proxy mlc-mqttbridge || true
      - sudo rm -f /etc/systemd/system/mlc-edge-proxy.service /etc/systemd/system/mlc-mqttbridge.service
      - sudo systemctl daemon-reload
      - 'echo "✓ mlc-edge-proxy + mlc-mqttbridge entfernt"'

  package:
    desc: "Baut RPM und DEB Pakete via nfpm"
    deps: [build]
    env:
      VERSION: "{{.VERSION}}"
    cmds:
      - mkdir -p build/dist
      - cd build/package && go run github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0 pkg --packager rpm --target ../dist/
      - cd build/package && go run github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0 pkg --packager deb --target ../dist/

  version:check:
    desc: "Versionsstempel am gebauten Binary prüfen: task build meldet VERSION, ein nacktes go build meldet dev"
    deps: [build]
    cmds:
      - |
        want="{{.VERSION}}"
        got=$(./bin/mlc-edge-proxy --version | awk '{print $NF}')
        [ "$got" = "$want" ] || { echo "✗ bin/mlc-edge-proxy meldet '$got', VERSION ist '$want'"; exit 1; }
        got=$(./bin/mqttbridge -version | awk '{print $NF}')
        [ "$got" = "$want" ] || { echo "✗ bin/mqttbridge meldet '$got', VERSION ist '$want'"; exit 1; }
        tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
        go build -o "$tmp/p" ./cmd/proxy
        got=$("$tmp/p" --version | awk '{print $NF}')
        [ "$got" = "dev" ] || { echo "✗ ungestempelter Build meldet '$got' statt dev — die Nummer steht im Quelltext"; exit 1; }
        echo "✓ Version $want gestempelt, ungestempelt dev"

  vet:
    desc: "go vet"
    cmds:
      - go vet ./...

  test:
    desc: "Tests mit Race-Detector"
    cmds:
      - go test -race -count=1 ./...

  vuln:
    desc: "Bekannte Schwachstellen im erreichbaren Code (govulncheck) — vor jedem Release"
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  check:
    desc: "Alles vor einem Merge/Release: vet, Tests, Schwachstellen, Versionsstempel"
    cmds:
      - task: vet
      - task: test
      - task: vuln
      - task: version:check

  semgrep:
    desc: 'Statische Sicherheitsprüfung: Bericht + Kurzfassung + Urteils-Abgleich (wöchentlich).'
    preconditions:
      - sh: command -v mlc-semgrep-baseline
        msg: "mlc-semgrep-* fehlen — in mlcintegration einmal `task install-all` laufen lassen."
    cmds:
      - mkdir -p reports
      # atomar: ein abgebrochener Lauf darf keinen halben Bericht hinterlassen; --jobs 4 wegen io_uring/RLIMIT_MEMLOCK
      - semgrep scan --config {{.CONFIG | default "p/golang"}} --jobs 4 --json --quiet --output reports/.semgrep.tmp.json . || true
      - mv reports/.semgrep.tmp.json reports/semgrep.json
      - mlc-semgrep-summary reports/semgrep.json
      - mlc-semgrep-baseline --report reports/semgrep.json --baseline semgrep-baseline.yaml

  semgrep:review:
    desc: 'Neue Befunde zur Beurteilung nachtragen (verdict/reason dann von Hand).'
    cmds:
      - mlc-semgrep-baseline --report reports/semgrep.json --baseline semgrep-baseline.yaml --update

  semgrep:new:
    desc: 'Nur was seit einem Bezugspunkt hinzukam — bricht ab, für CI.'
    cmds:
      - semgrep scan --config {{.CONFIG | default "p/golang"}} --jobs 4 --baseline-commit {{.SEIT | default "main"}} --error --quiet .
