version: '3'

vars:
  # Versucht die Git-Version zu lesen, Fallback ist "v1.1.0"
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "v1.1.0"
  LDFLAGS: "-X 'main.Version={{.VERSION}}'"

tasks:
  build-server:
    desc: "Baut das Go-Backend in den bin/ Ordner"
    cmds:
      - mkdir -p bin
      - go build -ldflags="{{.LDFLAGS}}" -o bin/mlc-edge-proxy cmd/proxy/main.go


  build-bridge:
    desc: "Baut das MQTT Bridge CLI-Tool in den bin/ Ordner"
    cmds:
      - mkdir -p bin
      - go build -ldflags="{{.LDFLAGS}}" -o bin/mqttbridge cmd/mqttbridge/main.go

  build:
    desc: "Baut Server und Bridge"
    deps: [build-server, build-bridge]

  swagger:
    desc: "Generiert die Swagger-Dokumentation für die REST-API"
    cmds:
      - swag init -g cmd/proxy/main.go -o docs/swagger

  run:
    desc: "Baut und startet den Proxy-Server lokal"
    deps: [build-server]
    cmds:
      - ./bin/mlc-edge-proxy

  devbridge:
    desc: "Startet die MQTT Bridge für lokale Tests (Master: 1883 -> Slave: 1884)"
    deps: [build-bridge]
    cmds:
      - ./bin/mqttbridge --master tcp://localhost:1883 --slave tcp://localhost:1884 --topic "#"

  clean:
    desc: "Löscht generierte Binaries und lokale Daten"
    cmds:
      - rm -rf bin/
      - rm -rf data/

  setup:
    desc: "Initialisiert die Go-Module"
    cmds:
      - go mod tidy

  install-service:
    desc: "Installiert den Systemd Service für die PAKET-Installation (/usr/bin + /etc/mlc-edge-proxy, User mlc-edge-proxy). Für den Betrieb AUS DEM REPO: install-service:local"
    cmds:
      - sudo cp deployment/proxy.service /etc/systemd/system/mlc-edge-proxy.service
      - sudo systemctl daemon-reload
      - sudo systemctl enable mlc-edge-proxy
      - sudo systemctl restart mlc-edge-proxy
      - 'echo "Service installiert und gestartet! Logs gibt es via journalctl -fu mlc-edge-proxy"'

  install-service:local:
    desc: "Installiert den Systemd Service für den Betrieb AUS DIESEM REPO (Binary + config.yaml hier, User mlc). Damit überlebt der Proxy einen Reboot. Benötigt sudo."
    deps: [build-server]
    cmds:
      # Platzhalter /opt/mlc2afmqttproxy → tatsächlicher Repo-Pfad (wie units:install im Sensor-Repo).
      - sed "s#/opt/mlc2afmqttproxy#$(pwd)#g" deploy/systemd/mlc-edge-proxy.service | sudo tee /etc/systemd/system/mlc-edge-proxy.service > /dev/null
      - sudo systemctl daemon-reload
      - sudo systemctl enable --now mlc-edge-proxy
      - 'echo "✓ mlc-edge-proxy installiert + enabled (startet automatisch nach Reboot). Logs: journalctl -fu mlc-edge-proxy"'

  uninstall-service:local:
    desc: "Entfernt den aus-dem-Repo Systemd Service wieder (benötigt sudo)"
    cmds:
      - sudo systemctl disable --now mlc-edge-proxy || true
      - sudo rm -f /etc/systemd/system/mlc-edge-proxy.service
      - sudo systemctl daemon-reload
      - 'echo "✓ mlc-edge-proxy entfernt"'

  package:
    desc: "Baut RPM und DEB Pakete via nfpm"
    deps: [build]
    cmds:
      - mkdir -p build/dist
      - cd build/package && go run github.com/goreleaser/nfpm/v2/cmd/nfpm@latest pkg --packager rpm --target ../dist/
      - cd build/package && go run github.com/goreleaser/nfpm/v2/cmd/nfpm@latest pkg --packager deb --target ../dist/
