name: "mlc-edge-proxy"
arch: "amd64" # This will be overridden by the CLI
platform: "linux"
version: "1.0.2" # This will be overridden by the CLI
maintainer: "MLC Team"
description: "MLC Edge Proxy - Store & Forward MQTT Buffer for Edge Ingestion"
vendor: "MLC"
homepage: "https://github.com/mlechner911/mlc2afmqttproxy"
license: "GPL-3.0-only"

contents:
  # The binary
  - src: "../../bin/mlc-edge-proxy"
    dst: "/usr/bin/mlc-edge-proxy"
    file_info:
      mode: 0755
  
  # Die Konfiguration: IMMER die Vorlage, nie die lokale config.yaml — die trägt echte
  # Zugangsdaten. Bis 07.11.2026 stand hier ../../config.yaml (0644); so lagen Upstream-
  # Passwort und Ingest-Token in den Paketen unter build/dist/ im öffentlichen Repository
  # (Sicherheitsprüfung P3-05). noreplace: ein Update überschreibt die eingerichtete Datei nicht.
  # 0640 + Gruppe mlc-edge-proxy (postinstall): nur root und der Dienst lesen die Zugangsdaten.
  - src: "../../config.example.yaml"
    dst: "/etc/mlc-edge-proxy/config.yaml"
    type: "config|noreplace"
    file_info:
      mode: 0640
  
  # The systemd service unit
  - src: "../../deployment/proxy.service"
    dst: "/lib/systemd/system/mlc-edge-proxy.service"
    file_info:
      mode: 0644

# Setup and teardown scripts
scripts:
  postinstall: "./postinstall.sh"
  preremove: "./preremove.sh"
