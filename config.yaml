# Erster Testlauf: an den MLC Sensor Monitor weiterleiten (eigener MQTT-Broker).
mode: "mqtt"

server:
  port: 8097

storage:
  path: "./data"

mqtt:
  # Lokaler Broker, an den Zigbee2MQTT publiziert (z2m mqtt.server hierauf zeigen).
  local_port: 1884
  ws_port: 1885
  # Upstream = MLC Sensor Monitor (eigener eingebetteter Broker). Gleicher Host →
  # 127.0.0.1; sonst <host>:51883. Backend braucht MQTT_BROKER_ADDR=0.0.0.0:51883.
  upstream: "tcp://127.0.0.1:51883"
  username: "edge-proxy"
  # MUSS einem Eintrag in INGEST_TOKENS des Backends entsprechen (deploy/.env).
  password: "60b03cfaddba96981b03490549f707a00332573bc84091b792d42687a1b0bac6"
  # Historische Zeitstempel mitschicken (Spätdaten/Catch-Up): JSON-Feld `ts` (ms).
  timestamp_mode: "json_inject"
  # Dedupliziert exakt gleiche Nachrichten auf dem gleichen Topic in diesem Zeitfenster (in ms).
  # Hilft massiv gegen Zigbee-Broadcast-Spamming. (0 = deaktiviert).
  deduplicate_interval_ms: 1000
  # Optional: Themen (Topics) filtern (spart Platz & Bandbreite, im Dashboard trotzdem sichtbar).
  filter:
    allowed_prefixes:
      - "zigbee2mqtt/"
    ignored_prefixes:
      - "zigbee2mqtt/bridge/logging"
      - "zigbee2mqtt/bridge/state"

# Fallback/alternativ (mode: http) — falls statt MQTT der HTTP-Ingest genutzt wird.
http:
  endpoint: "http://127.0.0.1:58080/api/v1/ingest"
  token: "edge-test-7f3a9c12e8"

worker:
  interval_ms: 100
  max_batch_size: 50
  batch_delay_ms: 10
  retry_min_s: 1
  retry_max_s: 60
