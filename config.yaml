# Erster Testlauf: an den MLC Sensor Monitor weiterleiten (eigener MQTT-Broker).
mode: "mqtt"

server:
  # Wenn false, wird das Web-Dashboard und die API (Port 8097) komplett deaktiviert.
  enable: true
  port: 8097
  # (Optional) HTTP Basic Auth für das Dashboard und die API:
  # username: "admin"
  # password: "secret-password"

storage:
  path: "./data"
  # Maximale Größe der Datenbank in Megabyte. Ist dieses Limit erreicht, 
  # blockt der Proxy alle einkommenden Nachrichten ("Tail Drop"), um die Festplatte zu schützen.
  max_size_mb: 1024

mqtt:
  # Lokaler Broker, an den Zigbee2MQTT publiziert (z2m mqtt.server hierauf zeigen).
  local_port: 1884
  ws_port: 1885
  # Upstream = MLC Sensor Monitor (eigener eingebetteter Broker). Gleicher Host →
  # 127.0.0.1; sonst <host>:51883. Backend braucht MQTT_BROKER_ADDR=0.0.0.0:51883.
  upstream: "tcp://127.0.0.1:51883"
  username: "edge-proxy"
  # MUSS einem Eintrag in INGEST_TOKENS des Backends entsprechen (deploy/.env).
  password: "60b03cfaddba96981b03490549f707a00332573bc84091b792d42687a1b0bac6"
  # Nutzt MQTT 5 Topic Aliases zur massiven Reduktion der übertragenen Datenmenge.
  topic_alias: true
  # Historische Zeitstempel mitschicken (Spätdaten/Catch-Up): JSON-Feld `ts` (ms).
  timestamp_mode: "v5_property"
  # Dedupliziert exakt gleiche Nachrichten auf dem gleichen Topic in diesem Zeitfenster (in ms).
  # Hilft massiv gegen Zigbee-Broadcast-Spamming. (0 = deaktiviert).
  deduplicate_interval_ms: 1000
  # Smart JSON Deduplication: Diese Keys werden beim Vergleich ignoriert, wenn
  # sie sich ändern, der Rest der Nachricht aber gleich bleibt. Leer lassen für reinen Byte-Vergleich.
  deduplicate_ignore_keys:
    - last_seen
    - linkquality
    - elapsed
  # Optional: Themen (Topics) filtern (spart Platz & Bandbreite, im Dashboard trotzdem sichtbar).
  filter:
    allowed_prefixes:
      - "zigbee2mqtt/"
    ignored_prefixes:
      - "zigbee2mqtt/bridge/logging"
      - "zigbee2mqtt/bridge/state"
    # Downstream: Nachrichten vom Upstream-Broker an lokale Clients forwarden (optional).
    # Damit können z.B. Aktor-Commands aus der Cloud an lokale Geräte gesendet werden.
    # Der Proxy vermeidet Endlosschleifen durch "origin"-Marker im Nachrichten-Header.
    #downstream_config:
    #  subscribe_topics:
    #      - "cloud/commands/+"
    #  rewrite:
    #    match_prefix: "cloud/commands/zigbee2mqtt/"
    #    replace_with: "zigbee2mqtt/"

# Fallback/alternativ (mode: http) — falls statt MQTT der HTTP-Ingest genutzt wird.
http:
  endpoint: "http://127.0.0.1:58080/api/v1/ingest"
  token: "edge-test-7f3a9c12e8"

worker:
  interval_ms: 100
  max_batch_size: 50
  batch_delay_ms: 10
  retry_min_s: 1
  retry_max_s: 60

# Optionale Selbst-Überwachung/-Steuerung über den MLC Sensor Monitor.
# STANDARDMÄSSIG AKTIV — der Proxy meldet sich periodisch als Dienst (Heartbeat)
# und ist fernsteuerbar (pause/resume/restart/stop). Er läuft aber auch OHNE Monitor
# normal weiter; schlägt der Heartbeat fehl, wird er einfach wiederholt. Es werden
# keine internen Monitor-Pakete eingebunden (lose Kopplung).
#
# Ohne weitere Angaben funktioniert das „out of the box": Heartbeat geht an
# http.endpoint mit http.token (bzw. mqtt.password als Token), Steuerung läuft über
# den ohnehin genutzten Upstream-Broker (mqtt.upstream / mqtt.username / mqtt.password).
monitor:
  # Gesamt-Schalter (Heartbeat + Steuerung). Auf false setzen, um die Anbindung
  # vollständig zu deaktivieren. (unges. = true)
  enabled: true
  # Nur die Fernsteuerung (cmd/svc/<device>) ein-/ausschalten. (unges. = true)
  control: true
  # Gerätename im Monitor (muss mit "svc-" beginnen). Daraus folgt das Steuer-Topic
  # cmd/svc/edgeproxy (ohne "svc-").
  device: "svc-edgeproxy"
  # Heartbeat-Intervall in Sekunden.
  interval_s: 30
  # Optional: abweichendes Heartbeat-Ziel/Token (sonst aus dem http-Block bzw.
  # mqtt.password). Praktisch, wenn mode: "mqtt" ist und der HTTP-Ingest woanders liegt.
  # ingest_url: "http://127.0.0.1:58080/api/v1/ingest"
  # token: "edge-test-7f3a9c12e8"
