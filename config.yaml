mode: "http"

server:
  port: 8097

storage:
  path: "./data"

mqtt:
  local_port: 1884
  ws_port: 1885
  upstream: "tcp://cloud-broker.example.com:1883"
  username: "user"
  password: "password"

http:
  endpoint: "https://api.example.com/ingest"
  token: "my-secret-token"

worker:
  interval_ms: 100
  max_batch_size: 50
  batch_delay_ms: 10
  retry_min_s: 1
  retry_max_s: 60
