definitions:
  history.Day:
    properties:
      buffer_max:
        description: BufferMax ist der höchste gemessene Pufferstand des Tages (Nachrichten).
        type: integer
      date:
        example: "2026-11-25"
        type: string
      dead_lettered:
        type: integer
      deduplicated:
        type: integer
      dropped_buffer_full:
        type: integer
      failed:
        type: integer
      filtered:
        type: integer
      forwarded:
        type: integer
      received:
        type: integer
      stored:
        type: integer
    type: object
  history.DeviceTotals:
    properties:
      month:
        type: integer
      today:
        type: integer
      week:
        type: integer
    type: object
  history.Period:
    properties:
      buffer_max:
        type: integer
      days:
        example: 7
        type: integer
      dead_lettered:
        type: integer
      deduplicated:
        type: integer
      dropped_buffer_full:
        type: integer
      failed:
        type: integer
      filtered:
        type: integer
      forwarded:
        type: integer
      from:
        example: "2026-11-19"
        type: string
      received:
        type: integer
      seconds:
        additionalProperties:
          format: int64
          type: integer
        description: Seconds je Zustand (State*) im Zeitraum; Zeit ohne Messung fehlt.
        type: object
      stored:
        type: integer
    type: object
  history.Point:
    properties:
      count:
        type: integer
      start:
        type: string
    type: object
  history.Slot:
    properties:
      buffer_max:
        description: BufferMax ist der höchste gemessene Pufferstand im Abschnitt.
        type: integer
      dead_lettered:
        type: integer
      deduplicated:
        type: integer
      dropped_buffer_full:
        type: integer
      failed:
        type: integer
      filtered:
        type: integer
      forwarded:
        type: integer
      received:
        type: integer
      start:
        type: string
      stored:
        type: integer
    type: object
  history.Span:
    properties:
      end:
        type: string
      open:
        description: 'Open: Der Zeitraum dauert noch an (End ist die letzte Messung).'
        type: boolean
      start:
        type: string
      state:
        example: upstream_down
        type: string
    type: object
  web.DeviceHistoryResponse:
    properties:
      name:
        type: string
      points:
        items:
          $ref: '#/definitions/history.Point'
        type: array
      resolution:
        description: 'Resolution: "day" oder "hour".'
        example: day
        type: string
    type: object
  web.DeviceInfo:
    properties:
      availability:
        description: 'Availability: online/offline laut z2m; leer, wenn z2m keine
          Verfügbarkeit meldet.'
        type: string
      avg_interval_s:
        description: |-
          AvgIntervalS ist der mittlere Abstand zwischen zwei Nachrichten in den letzten 7 Tagen
          (nur Laufzeit des Proxys); 0 = zu wenige Nachrichten für eine Aussage.
        type: integer
      battery:
        type: number
      description:
        type: string
      ieee:
        example: "0x00158d0000000001"
        type: string
      known:
        description: 'Known: in bridge/devices aufgeführt (sonst nur aus einem Topic
          erschlossen).'
        type: boolean
      last_seen:
        type: string
      linkquality:
        type: number
      messages:
        $ref: '#/definitions/history.DeviceTotals'
      model:
        type: string
      name:
        example: Wohnzimmer Temperatur
        type: string
      power_source:
        type: string
      status:
        example: ok
        type: string
      type:
        description: 'Type: Coordinator, Router oder EndDevice (z2m).'
        type: string
      vendor:
        type: string
    type: object
  web.DevicesResponse:
    properties:
      devices:
        items:
          $ref: '#/definitions/web.DeviceInfo'
        type: array
    type: object
  web.HealthResponse:
    properties:
      status:
        description: Status der Anwendung (normalerweise "ok").
        type: string
      version:
        description: Die aktuelle Version der Proxy-Anwendung.
        type: string
    type: object
  web.HistoryDetailResponse:
    properties:
      from:
        type: string
      slot_seconds:
        example: 600
        type: integer
      slots:
        items:
          $ref: '#/definitions/history.Slot'
        type: array
      spans:
        items:
          $ref: '#/definitions/history.Span'
        type: array
      to:
        type: string
    type: object
  web.HistoryResponse:
    properties:
      daily:
        items:
          $ref: '#/definitions/history.Day'
        type: array
      days:
        example: 30
        type: integer
      interruptions:
        description: Interruptions sind die Zeiträume ohne Weiterleitung im Fenster,
          neueste zuerst (max. 200).
        items:
          $ref: '#/definitions/history.Span'
        type: array
      periods:
        items:
          $ref: '#/definitions/history.Period'
        type: array
    type: object
  web.StatsResponse:
    properties:
      buffer_count:
        description: Die aktuelle Anzahl der in BadgerDB zwischengespeicherten Nachrichten.
        type: integer
      messages_dead_lettered_total:
        description: Endgültig abgelehnt und in der Dead-Letter-Datei abgelegt (nicht
          weitergeleitet).
        type: integer
      messages_deduplicated_total:
        type: integer
      messages_dropped_buffer_full_total:
        description: Bei vollem Puffer nicht angenommen (Tail-Drop) — diese Werte
          fehlen im Nachweis.
        type: integer
      messages_filtered_total:
        description: Von den Topic-Filtern (allowed_prefixes / ignored_prefixes) verworfen.
          Bis 25.11.2026 nicht gezählt.
        type: integer
      messages_forward_failed_total:
        type: integer
      messages_forwarded_total:
        type: integer
      messages_received_total:
        type: integer
      messages_stored_total:
        type: integer
    type: object
info:
  contact: {}
paths:
  /api/v1/devices:
    get:
      description: Geräte aus zigbee2mqtt mit Nachrichten heute/7/30 Tage, mittlerem
        Sendeabstand und Status (ok, silent, offline, unknown).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/web.DevicesResponse'
      summary: Zigbee-Geräte
      tags:
      - Devices
  /api/v1/devices/history:
    get:
      description: 'Ohne from: Tageswerte der letzten `days` Tage (1–400, Standard
        30). Mit from (RFC3339, to optional): Stundenwerte, höchstens 31 Tage.'
      parameters:
      - description: Gerätename (friendly_name)
        in: query
        name: name
        required: true
        type: string
      - description: Tage
        in: query
        name: days
        type: integer
      - description: Beginn (RFC3339) — Stundenwerte
        in: query
        name: from
        type: string
      - description: Ende (RFC3339)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/web.DeviceHistoryResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verlauf eines Zigbee-Geräts
      tags:
      - Devices
  /api/v1/health:
    get:
      description: Zeigt an, ob der Proxy läuft, und gibt die aktuelle Version aus.
      produces:
      - application/json
      responses:
        "200":
          description: Erfolgreiche Antwort
          schema:
            $ref: '#/definitions/web.HealthResponse'
      summary: Health-Check abrufen
      tags:
      - Health
  /api/v1/history:
    get:
      description: Tageswerte der letzten `days` Tage, Summen für 1/7/30/365 Tage
        und die Unterbrechungen der Weiterleitung.
      parameters:
      - description: Tage (1–400, Standard 30)
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/web.HistoryResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verlauf (Tageswerte und Zeiträume)
      tags:
      - History
  /api/v1/history/detail:
    get:
      description: 'Abschnitte und Zustandsintervalle in [from, to). Standard: die
        letzten 24 Stunden; höchstens 31 Tage.'
      parameters:
      - description: Beginn (RFC3339)
        in: query
        name: from
        type: string
      - description: Ende (RFC3339)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/web.HistoryDetailResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verlauf im Detail (10-Minuten-Abschnitte)
      tags:
      - History
  /api/v1/stats:
    get:
      description: Gibt die Anzahl der aktuell in BadgerDB zwischengespeicherten Nachrichten
        zurück.
      produces:
      - application/json
      responses:
        "200":
          description: Erfolgreiche Antwort
          schema:
            $ref: '#/definitions/web.StatsResponse'
      summary: Puffer-Statistik abrufen
      tags:
      - Stats
swagger: "2.0"
