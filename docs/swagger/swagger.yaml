definitions:
  control.Entry:
    properties:
      device:
        type: string
      fields:
        additionalProperties: {}
        type: object
      id:
        type: string
      ieee:
        type: string
      reason:
        type: string
      result:
        type: string
      tenant:
        type: string
      time:
        type: string
    type: object
  history.Day:
    properties:
      buffer_max:
        description: BufferMax ist der höchste gemessene Pufferstand des Tages (Nachrichten).
        type: integer
      date:
        example: "2026-11-25"
        type: string
      dead_lettered:
        type: integer
      deduplicated:
        type: integer
      dropped_buffer_full:
        type: integer
      failed:
        type: integer
      filtered:
        type: integer
      forwarded:
        type: integer
      received:
        type: integer
      stored:
        type: integer
    type: object
  history.DeviceTotals:
    properties:
      month:
        type: integer
      today:
        type: integer
      week:
        type: integer
    type: object
  history.Period:
    properties:
      buffer_max:
        type: integer
      days:
        example: 7
        type: integer
      dead_lettered:
        type: integer
      deduplicated:
        type: integer
      dropped_buffer_full:
        type: integer
      failed:
        type: integer
      filtered:
        type: integer
      forwarded:
        type: integer
      from:
        example: "2026-11-19"
        type: string
      received:
        type: integer
      seconds:
        additionalProperties:
          format: int64
          type: integer
        description: Seconds je Zustand (State*) im Zeitraum; Zeit ohne Messung fehlt.
        type: object
      stored:
        type: integer
    type: object
  history.Point:
    properties:
      count:
        type: integer
      start:
        type: string
    type: object
  history.Slot:
    properties:
      buffer_max:
        description: BufferMax ist der höchste gemessene Pufferstand im Abschnitt.
        type: integer
      dead_lettered:
        type: integer
      deduplicated:
        type: integer
      dropped_buffer_full:
        type: integer
      failed:
        type: integer
      filtered:
        type: integer
      forwarded:
        type: integer
      received:
        type: integer
      start:
        type: string
      stored:
        type: integer
    type: object
  history.Span:
    properties:
      end:
        type: string
      open:
        description: 'Open: Der Zeitraum dauert noch an (End ist die letzte Messung).'
        type: boolean
      start:
        type: string
      state:
        example: upstream_down
        type: string
    type: object
  web.ControlResponse:
    properties:
      counts:
        additionalProperties:
          format: int64
          type: integer
        type: object
      direct:
        description: 'Direct: Befehle über den eigenen Broker; sonst über control.broker
          (z. B. Mosquitto).'
        type: boolean
      enabled:
        type: boolean
      recent:
        items:
          $ref: '#/definitions/control.Entry'
        type: array
      tenants:
        items:
          $ref: '#/definitions/web.ControlTenant'
        type: array
    type: object
  web.ControlTenant:
    properties:
      allowed:
        additionalProperties:
          items:
            type: string
          type: array
        description: IEEE → Felder
        type: object
      customer:
        type: string
      name:
        example: main
        type: string
    type: object
  web.DeviceHistoryResponse:
    properties:
      name:
        type: string
      points:
        items:
          $ref: '#/definitions/history.Point'
        type: array
      resolution:
        description: 'Resolution: "day" oder "hour".'
        example: day
        type: string
    type: object
  web.DeviceInfo:
    properties:
      availability:
        description: 'Availability: online/offline laut z2m; leer, wenn z2m keine
          Verfügbarkeit meldet.'
        type: string
      avg_interval_s:
        description: |-
          AvgIntervalS ist der mittlere Abstand zwischen zwei Nachrichten in den letzten 7 Tagen
          (nur Laufzeit des Proxys); 0 = zu wenige Nachrichten für eine Aussage.
        type: integer
      battery:
        type: number
      description:
        type: string
      ieee:
        example: "0x00158d0000000001"
        type: string
      known:
        description: 'Known: in bridge/devices aufgeführt (sonst nur aus einem Topic
          erschlossen).'
        type: boolean
      last_seen:
        type: string
      linkquality:
        type: number
      messages:
        $ref: '#/definitions/history.DeviceTotals'
      model:
        type: string
      name:
        example: Wohnzimmer Temperatur
        type: string
      power_source:
        type: string
      status:
        example: ok
        type: string
      type:
        description: 'Type: Coordinator, Router oder EndDevice (z2m).'
        type: string
      vendor:
        type: string
      writable:
        description: 'Writable: per <name>/set schreibbare Eigenschaften laut z2m-Definition
          (exposes).'
        items:
          type: string
        type: array
    type: object
  web.DevicesResponse:
    properties:
      devices:
        items:
          $ref: '#/definitions/web.DeviceInfo'
        type: array
    type: object
  web.FiltersResponse:
    properties:
      dedup_ignore_keys:
        items:
          type: string
        type: array
      dedup_interval_ms:
        type: integer
      deduplicated_total:
        type: integer
      routes:
        items:
          $ref: '#/definitions/web.RouteInfo'
        type: array
      rules:
        items:
          $ref: '#/definitions/web.Rule'
        type: array
      target:
        type: string
    type: object
  web.HealthResponse:
    properties:
      status:
        description: Status der Anwendung (normalerweise "ok").
        type: string
      version:
        description: Die aktuelle Version der Proxy-Anwendung.
        type: string
    type: object
  web.HistoryDetailResponse:
    properties:
      from:
        type: string
      slot_seconds:
        example: 600
        type: integer
      slots:
        items:
          $ref: '#/definitions/history.Slot'
        type: array
      spans:
        items:
          $ref: '#/definitions/history.Span'
        type: array
      to:
        type: string
    type: object
  web.HistoryResponse:
    properties:
      daily:
        items:
          $ref: '#/definitions/history.Day'
        type: array
      days:
        example: 30
        type: integer
      interruptions:
        description: Interruptions sind die Zeiträume ohne Weiterleitung im Fenster,
          neueste zuerst (max. 200).
        items:
          $ref: '#/definitions/history.Span'
        type: array
      periods:
        items:
          $ref: '#/definitions/history.Period'
        type: array
    type: object
  web.RouteInfo:
    properties:
      devices:
        items:
          type: string
        type: array
      name:
        type: string
      upstream:
        type: string
    type: object
  web.Rule:
    properties:
      hits:
        type: integer
      kind:
        description: 'Kind: allow (Topic muss mit einem dieser Präfixe beginnen) oder
          ignore.'
        example: ignore
        type: string
      prefix:
        type: string
    type: object
  web.StatsResponse:
    properties:
      buffer_count:
        description: Die aktuelle Anzahl der in BadgerDB zwischengespeicherten Nachrichten.
        type: integer
      commands_skipped_total:
        description: Befehle an zigbee2mqtt (…/set, …/get, bridge/request) — keine
          Messwerte, nicht weitergeleitet.
        type: integer
      messages_dead_lettered_total:
        description: Endgültig abgelehnt und in der Dead-Letter-Datei abgelegt (nicht
          weitergeleitet).
        type: integer
      messages_deduplicated_total:
        type: integer
      messages_dropped_buffer_full_total:
        description: Bei vollem Puffer nicht angenommen (Tail-Drop) — diese Werte
          fehlen im Nachweis.
        type: integer
      messages_filtered_total:
        description: Von den Topic-Filtern (allowed_prefixes / ignored_prefixes) verworfen.
          Bis 25.11.2026 nicht gezählt.
        type: integer
      messages_forward_failed_total:
        type: integer
      messages_forwarded_total:
        type: integer
      messages_received_total:
        type: integer
      messages_stored_total:
        type: integer
    type: object
  web.StatusResponse:
    properties:
      authorized:
        description: 'Authorized: Diese Anfrage darf den geschützten Teil sehen (angemeldet
          oder lokal ohne Passwort).'
        type: boolean
      buffer_pending:
        type: integer
      devices_public:
        type: boolean
      last_forward_age_s:
        description: Alter in Sekunden; -1 = seit dem Start noch nie.
        type: integer
      last_receive_age_s:
        type: integer
      login_configured:
        description: 'LoginConfigured: Es gibt ein Passwort; die Live-Ansicht lässt
          sich anmelden.'
        type: boolean
      mode:
        example: mqtt
        type: string
      state:
        description: 'State: ok, upstream_down, paused, buffer_full (wie im Verlauf).'
        example: ok
        type: string
      upstream_connected:
        type: boolean
      uptime_s:
        type: integer
      version:
        type: string
      zigbee_connected:
        type: boolean
    type: object
info:
  contact: {}
paths:
  /api/v1/control:
    get:
      description: Freigegebene Geräte je Mandant, Ergebnisse seit dem Start, die
        letzten 200 Befehle. Nur angemeldet.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/web.ControlResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Rückweg (Befehle aus dem Monitor)
      tags:
      - Control
  /api/v1/devices:
    get:
      description: Geräte aus zigbee2mqtt mit Nachrichten heute/7/30 Tage, mittlerem
        Sendeabstand und Status (ok, silent, offline, unknown).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/web.DevicesResponse'
      summary: Zigbee-Geräte
      tags:
      - Devices
  /api/v1/devices/history:
    get:
      description: 'Ohne from: Tageswerte der letzten `days` Tage (1–400, Standard
        30). Mit from (RFC3339, to optional): Stundenwerte, höchstens 31 Tage.'
      parameters:
      - description: Gerätename (friendly_name)
        in: query
        name: name
        required: true
        type: string
      - description: Tage
        in: query
        name: days
        type: integer
      - description: Beginn (RFC3339) — Stundenwerte
        in: query
        name: from
        type: string
      - description: Ende (RFC3339)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/web.DeviceHistoryResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verlauf eines Zigbee-Geräts
      tags:
      - Devices
  /api/v1/filters:
    get:
      description: Topic-Filter mit Treffern je Regel seit dem Start, Deduplizierung,
        zusätzliche Routen. Nur angemeldet.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/web.FiltersResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Filter und Routen
      tags:
      - Status
  /api/v1/health:
    get:
      description: Zeigt an, ob der Proxy läuft, und gibt die aktuelle Version aus.
      produces:
      - application/json
      responses:
        "200":
          description: Erfolgreiche Antwort
          schema:
            $ref: '#/definitions/web.HealthResponse'
      summary: Health-Check abrufen
      tags:
      - Health
  /api/v1/history:
    get:
      description: Tageswerte der letzten `days` Tage, Summen für 1/7/30/365 Tage
        und die Unterbrechungen der Weiterleitung.
      parameters:
      - description: Tage (1–400, Standard 30)
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/web.HistoryResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verlauf (Tageswerte und Zeiträume)
      tags:
      - History
  /api/v1/history/detail:
    get:
      description: 'Abschnitte und Zustandsintervalle in [from, to). Standard: die
        letzten 24 Stunden; höchstens 31 Tage.'
      parameters:
      - description: Beginn (RFC3339)
        in: query
        name: from
        type: string
      - description: Ende (RFC3339)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/web.HistoryDetailResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verlauf im Detail (10-Minuten-Abschnitte)
      tags:
      - History
  /api/v1/stats:
    get:
      description: Gibt die Anzahl der aktuell in BadgerDB zwischengespeicherten Nachrichten
        zurück.
      produces:
      - application/json
      responses:
        "200":
          description: Erfolgreiche Antwort
          schema:
            $ref: '#/definitions/web.StatsResponse'
      summary: Puffer-Statistik abrufen
      tags:
      - Stats
  /api/v1/status:
    get:
      description: Läuft der Proxy, leitet er weiter? Zustand, Puffer, Verbindungen,
        Alter der letzten Weiterleitung. Öffentlich, wenn server.public_stats (Standard).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/web.StatusResponse'
      summary: Kurzstatus
      tags:
      - Status
swagger: "2.0"
