<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="5">
    <title>{{ .title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="display-6">{{ .title }}</h1>
        <hr>
        <div class="row">
            <div class="col-md-4">
                <div class="card mb-3 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">System Status</h5>
                        <p class="card-text">Broker: <span class="badge bg-success">Online</span></p>
                        <p class="card-text">Upstream: <span class="badge bg-warning text-dark">Mocked</span></p>
                        <p class="card-text">Buffer: 
                            <span class="badge {{ if eq .buffer_count 0 }}bg-success{{ else }}bg-danger{{ end }}">
                                {{ .buffer_count }} Nachrichten
                            </span>
                        </p>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-white">
                        <h5 class="card-title mb-0">Lokaler Puffer (Älteste 10)</h5>
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-striped table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>Timestamp</th>
                                    <th>Topic</th>
                                </tr>
                            </thead>
                            <tbody>
                                {{ range .recent }}
                                <tr>
                                    <td><small class="text-muted">{{ ._timestamp }}</small></td>
                                    <td><strong>{{ .topic }}</strong></td>
                                </tr>
                                {{ else }}
                                <tr>
                                    <td colspan="2" class="text-center text-muted py-3">Keine Nachrichten im Puffer</td>
                                </tr>
                                {{ end }}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
